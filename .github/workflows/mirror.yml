name: Mirror Repository

on:
  push:
    branches:
      - main

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Mirror clone and push (no marketplace actions)
        env:
          SOURCE_REPO: ${{ github.repository }}
          TARGET_REPO: devrecsoc/devs-results
          SOURCE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TOKEN: ${{ secrets.DEVS_PAT }}
        run: |
          set -euo pipefail
          echo "git version: $(git --version)"

          # Clone all refs and history from the source repo
          git clone --mirror https://x-access-token:${SOURCE_TOKEN}@github.com/${SOURCE_REPO} repo.git
          cd repo.git

          # Set push URL to target (use DEVS_PAT which must have write access)
          git remote set-url --push origin https://x-access-token:${TARGET_TOKEN}@github.com/${TARGET_REPO}

          # Push everything (branches, tags, refs)
          git push --mirror origin
